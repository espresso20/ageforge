<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Changelog: AgeForge</title>
        <meta name="description" content="AgeForge release history and update notes." />
        <meta name="theme-color" content="#07090c" />
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d1117'/%3E%3Cpath d='M8 2.5 13.5 8 8 13.5 2.5 8z' fill='%23ffd700'/%3E%3C/svg%3E"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
        <style>
            .cl-head,
            .cl-feed {
                width: min(760px, calc(100% - 32px));
                margin: 0 auto;
            }
            .cl-head {
                padding: 110px 0 28px;
            }
            .cl-head h1 {
                margin: 0 0 6px;
                font-size: clamp(30px, 5vw, 48px);
                font-weight: 800;
                letter-spacing: -0.02em;
            }
            .cl-head p {
                margin: 0;
                color: var(--dim);
                font-size: 14px;
            }
            .cl-feed {
                padding: 12px 0 72px;
            }
            .cl-entry {
                position: relative;
                padding: 0 0 40px 26px;
                border-left: 2px solid var(--line);
            }
            .cl-entry::before {
                content: "◆";
                position: absolute;
                left: -8px;
                top: 0;
                color: var(--accent-ink);
                background: var(--bg);
                font-size: 13px;
                line-height: 1.4;
            }
            .cl-entry:last-child {
                border-left-color: transparent;
            }
            .cl-tag {
                color: var(--accent-ink);
                font-weight: 800;
            }
            .cl-date {
                margin-left: 12px;
                color: var(--dim);
                font-size: 13px;
            }
            .cl-body {
                margin-top: 10px;
                font-size: 14px;
                line-height: 1.7;
            }
            .cl-body h3 {
                margin: 18px 0 6px;
                font-size: 12px;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--dim);
            }
            .cl-body h3:first-child {
                margin-top: 0;
            }
            .cl-body ul {
                margin: 0;
                padding-left: 1.2em;
            }
            .cl-body li {
                margin: 0 0 6px;
            }
            .cl-body code {
                padding: 0 4px;
                border: 1px solid var(--line);
                border-radius: 4px;
                font-size: 0.92em;
            }
            .cl-gh-link {
                display: inline-block;
                margin-top: 8px;
                color: var(--dim);
                font-size: 13px;
            }
            .cl-loading,
            .cl-empty,
            .cl-error {
                padding: 48px 0;
                color: var(--dim);
                font-size: 14px;
            }
            .cl-error {
                color: #f85149;
            }
        </style>
    </head>
    <body>
        <header class="bar">
            <a class="bar-mark" href="index.html" aria-label="AgeForge home">◆</a>
            <nav class="bar-nav" aria-label="Site">
                <a href="docs/">Docs</a>
                <a href="https://github.com/espresso20/ageforge" rel="noopener">GitHub</a>
                <a href="changelog.html" aria-current="page">Changelog</a>
            </nav>
        </header>

        <header class="cl-head">
            <h1>Changelog</h1>
            <p>Every release and what changed in it.</p>
        </header>

        <main class="cl-feed" id="cl-feed">
            <div class="cl-loading">Loading releases…</div>
        </main>

        <footer class="foot">
            <nav class="foot-nav" aria-label="More">
                <a href="index.html">Home</a>
                <a href="docs/">Docs</a>
                <a href="https://github.com/espresso20/ageforge/releases" rel="noopener">Releases on GitHub</a>
                <a href="https://discord.gg/EPvyd5vjpj" rel="noopener">Discord</a>
            </nav>
        </footer>

        <script src="changelog.js"></script>
    </body>
</html>
