<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgeForge Wiki</title>
  <meta name="description" content="Complete wiki for AgeForge, the terminal empire builder. Commands, ages, buildings, technologies and more.">
  <meta name="theme-color" content="#dde3ea">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+Double+Pica&family=IM+Fell+Double+Pica+SC&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <link rel="stylesheet" href="custom.css">
</head>
<body>
  <div id="app">Loading wiki…</div>
  <script>
    window.$docsify = {
      name: 'AgeForge',
      nameLink: '/',
      repo: 'https://github.com/espresso20/ageforge',
      loadSidebar: true,
      loadNavbar: '_navbar.md',
      subMaxLevel: 2,
      // Retired pages land on the pages that replaced them.
      alias: {
        '/city-map': '/map',
        '/world-map': '/map',
        '/villagers': '/workers-and-domains',
      },
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search the wiki…',
        noData: 'No results.',
      },
      copyCode: { buttonText: 'Copy', errorText: 'Error', successText: 'Copied' },
      themeColor: '#a3211b',
    };
  </script>
  <script src="screens.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
