[build]
  command = ""
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Cache-Control              = "public, max-age=3600"
    Strict-Transport-Security  = "max-age=63072000; includeSubDomains"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy    = "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; img-src 'self' raw.githubusercontent.com data:; connect-src api.github.com; frame-ancestors 'none'; base-uri 'self';"

# Docs (Docsify wiki) — relaxed CSP: needs CDN JS/CSS, inline script, and
# fetch() to self for loading .md files. Overrides the /* rule for /docs/*.
[[headers]]
  for = "/docs/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Cache-Control             = "public, max-age=3600"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy   = "default-src 'none'; script-src 'self' cdn.jsdelivr.net 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' fonts.googleapis.com cdn.jsdelivr.net; font-src fonts.gstatic.com; img-src 'self' data: raw.githubusercontent.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self';"

# Long-cache for fonts/assets
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from   = "/wiki"
  to     = "/docs/"
  status = 301
