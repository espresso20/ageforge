name: Go

on:
  # labeled: adding the "smoke" label to a pull request runs the smoke job.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "site/**"
      - "**.md"
  push:
    branches: [master]
    paths-ignore:
      - "site/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: gofmt, vet, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted (run: gofmt -w .):"
            for f in $unformatted; do
              echo "::error file=$f::not gofmt-formatted"
            done
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # Same targets release.yml ships; linux/amd64 is covered by go build above.
      - name: cross-compile release targets
        run: |
          for target in linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null .
          done

  # Tests in four parallel shards. The old single job ran every package under
  # the race detector on one runner and took 23 to 30 minutes (smoke 15, ui 12,
  # roguelike 8 under -race). On a pull request only the game package, where
  # the engine's locks and bus handlers live, runs under -race; on master
  # every shard does, so a race still surfaces after the merge.
  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [smoke, ui, maps, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        env:
          SHARD: ${{ matrix.shard }}
          FULL_RACE: ${{ github.event_name == 'push' }}
        run: |
          case "$SHARD" in
            smoke) pkgs="./smoke/..." ;;
            ui)    pkgs=$(go list ./ui/... | grep -v /ui/mapstyle) ;;
            maps)  pkgs="./ui/mapstyle/..." ;;
            rest)  pkgs=$(go list ./... | grep -v -e /smoke -e /ui) ;;
          esac
          if [ "$FULL_RACE" = "true" ]; then
            go test -race -timeout 40m $pkgs
          elif [ "$SHARD" = "rest" ]; then
            go test -race -timeout 20m ./game/...
            go test -timeout 20m $(echo "$pkgs" | grep -v /game)
          else
            go test -timeout 20m $pkgs
          fi

  # The smoke suite's fast tier on every pull request (see CONTRIBUTING.md,
  # "Smoke testing"), without the scenarios that play the test bot: static
  # gates, docsync, accounts, perf budgets and the UI at small terminal sizes.
  #
  # The bot is switched off for now (2026-10-10) while the economy's numbers
  # are being re-derived by calculation: it does not play on pull requests and
  # no pacing band can fail a change. The nightly and weekly Smoke workflow
  # and the Determinism workflow are disabled in the repository settings for
  # the same reason. To switch it back on: restore the line below to
  # `go run ./cmd/smoke -tier fast -pacing enforce -v -out smoke-report`
  # and run `gh workflow enable Smoke` and `gh workflow enable Determinism`.
  # The smoke package's unit tests that need the bot to play well are skipped
  # the same way (smoke/bot_switch_test.go); set AGEFORGE_BOT_TESTS=1 to run them.
  # Only on request (owner, 2026-10-20): a pull request labeled "smoke", or a
  # manual run (gh workflow run Go --ref <branch>). The smoke package's unit
  # tests, which hold the static rule checks, still run in the test shards.
  smoke:
    name: smoke (fast tier)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A flag, not the secrets themselves, so the smoke step (PR code) never
      # sees them. Empty on fork PRs and until the secrets are set; the email
      # step then skips. Set the repo variable SMOKE_EMAIL_PR to "false" to
      # stop PR emails and keep the nightly ones.
      MAIL_ENABLED: ${{ secrets.MAIL_USERNAME != '' && secrets.MAIL_PASSWORD != '' && secrets.MAIL_TO != '' && vars.SMOKE_EMAIL_PR != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Smoke (fast tier)
        id: smoke
        run: go run ./cmd/smoke -tier fast -scenario static,docsync,accounts,perf,ui -v -out smoke-report

      - name: Job summary
        if: ${{ always() }}
        run: |
          if [ -f smoke-report/summary.md ]; then
            cat smoke-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The smoke run wrote no report; see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: smoke-report
          path: smoke-report/
          if-no-files-found: warn

      - name: Email body
        id: email
        if: ${{ always() && env.MAIL_ENABLED == 'true' }}
        env:
          RESULT: ${{ steps.smoke.outcome == 'success' && 'PASS' || 'FAIL' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/smoke-email.sh "PR #$PR_NUMBER"

      - name: Email the report
        if: ${{ always() && env.MAIL_ENABLED == 'true' && steps.email.outcome == 'success' }}
        # dawidd6/action-send-mail v22
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: AgeForge Smoke <${{ secrets.MAIL_USERNAME }}>
          subject: ${{ steps.email.outputs.subject }}
          body: file://${{ runner.temp }}/smoke-email.md
          html_body: file://${{ runner.temp }}/smoke-email.md
          convert_markdown: true
          attachments: ${{ steps.email.outputs.attachments }}
