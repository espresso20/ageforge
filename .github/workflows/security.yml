name: Security

# govulncheck: known vulnerabilities in the standard library and in the modules
# the code actually calls. gitleaks: secrets in a pull request's commits.
#
# Both report and never fail the run for now (continue-on-error on the scan
# step; the findings are in the job summary). See docs/ci.md for what each
# check does, how to run it locally, and how to silence a false positive.

on:
  pull_request:
  schedule:
    - cron: "23 5 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: govulncheck
        id: scan
        continue-on-error: true
        run: |
          set -o pipefail
          govulncheck ./... 2>&1 | tee govulncheck.txt

      - name: Job summary
        if: ${{ always() }}
        run: |
          {
            echo "### govulncheck"
            echo
            if [ ! -s govulncheck.txt ]; then
              echo "The scan wrote no output; see the step log."
            elif grep -q '^Vulnerability #' govulncheck.txt; then
              echo "Vulnerabilities the code calls: $(grep -c '^Vulnerability #' govulncheck.txt)"
              echo
              echo '```'
              grep -E '^Vulnerability #|^ +(Found|Fixed) in:|^Your code|^This scan|^Use ' govulncheck.txt || true
              echo '```'
              echo
              echo "Reporting only: this check does not fail the run yet."
            else
              echo "No called vulnerabilities."
              echo
              echo '```'
              tail -n 5 govulncheck.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: govulncheck
          path: govulncheck.txt
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The OSS CLI from the vendor's release page, checked against a hash
      # written here (the vendor's own checksum file has the same value), not
      # the licensed organization action.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" "$url"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: gitleaks
        id: scan
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # --redact: the report and the log never contain the secret itself.
          if [ "$EVENT" = "pull_request" ]; then
            echo "Scanning the pull request's commits: ${BASE_SHA}..${HEAD_SHA}"
            gitleaks git --no-banner --redact --log-opts="${BASE_SHA}..${HEAD_SHA}" \
              --report-format json --report-path gitleaks.json .
          else
            echo "Scanning the whole history"
            gitleaks git --no-banner --redact --report-format json --report-path gitleaks.json .
          fi

      - name: Job summary
        if: ${{ always() }}
        run: |
          {
            echo "### gitleaks"
            echo
            if [ ! -f gitleaks.json ]; then
              echo "The scan wrote no report; see the step log."
            elif [ "$(jq length gitleaks.json)" = "0" ]; then
              echo "No secrets found."
            else
              echo "Possible secrets: $(jq length gitleaks.json) (values are redacted)"
              echo
              echo "| Rule | File | Line | Commit |"
              echo "| --- | --- | --- | --- |"
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | \(.Commit[0:8]) |"' gitleaks.json
              echo
              echo "Reporting only: this check does not fail the run yet. If a finding is a false positive, see docs/ci.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f gitleaks.json ] && [ "$(jq length gitleaks.json)" != "0" ]; then
            echo "::warning::gitleaks found $(jq length gitleaks.json) possible secret(s); see the job summary"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: gitleaks
          path: gitleaks.json
          if-no-files-found: ignore
