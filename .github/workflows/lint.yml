name: Lint

# golangci-lint (bug finders, security rules, performance hints; the set is in
# .golangci.yml), go.mod hygiene, and a weekly dead-code report.
#
# Everything here reports and never fails the run for now. golangci-lint on a
# pull request shows only the findings the change adds; the weekly and master
# runs show them all. See docs/ci.md.

on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/lint.yml"
  push:
    branches: [master]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/lint.yml"
  schedule:
    - cron: "11 5 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # lets the action fetch the pull request's patch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        id: lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          only-new-issues: ${{ github.event_name == 'pull_request' }}
          args: --output.json.path=golangci-lint.json

      - name: Job summary
        if: ${{ always() }}
        env:
          NEW_ONLY: ${{ github.event_name == 'pull_request' }}
        run: |
          {
            echo "### golangci-lint"
            echo
            if [ ! -f golangci-lint.json ]; then
              echo "The run wrote no report; see the step log."
            else
              total=$(jq '.Issues // [] | length' golangci-lint.json)
              if [ "$NEW_ONLY" = "true" ]; then
                echo "Findings this change adds: **$total**"
              else
                echo "Findings: **$total**"
              fi
              echo
              if [ "$total" != "0" ]; then
                echo "| Linter | Findings |"
                echo "| --- | ---: |"
                jq -r '.Issues // [] | group_by(.FromLinter) | map({l: .[0].FromLinter, n: length}) | sort_by(-.n)[] | "| \(.l) | \(.n) |"' golangci-lint.json
                echo
                echo "Reporting only: this check does not fail the run yet."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: golangci-lint
          path: golangci-lint.json
          if-no-files-found: ignore

  modules:
    name: go.mod hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy leaves no diff
        id: tidy
        continue-on-error: true
        run: |
          set -o pipefail
          go mod tidy -diff 2>&1 | tee tidy.txt

      - name: go mod verify
        id: verify
        continue-on-error: true
        run: go mod verify

      - name: Job summary
        if: ${{ always() }}
        env:
          TIDY: ${{ steps.tidy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          {
            echo "### go.mod hygiene"
            echo
            echo "- go mod tidy: $TIDY"
            echo "- go mod verify: $VERIFY"
            if [ "$TIDY" != "success" ]; then
              echo
              echo "Run \`go mod tidy\` and commit go.mod and go.sum. The diff it wants:"
              echo
              echo '```diff'
              head -n 60 tidy.txt
              echo '```'
            fi
            echo
            echo "Reporting only: this check does not fail the run yet."
          } >> "$GITHUB_STEP_SUMMARY"

  deadcode:
    name: dead code report
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@v0.52.0

      # Functions no main package reaches. With -test, test code counts as a
      # root too, so what is left is not even used by a test.
      - name: deadcode
        run: |
          deadcode ./... > deadcode.txt
          deadcode -test ./... > deadcode-test.txt

      - name: Job summary
        run: |
          {
            echo "### Dead code"
            echo
            echo "- Unreachable from any main package: **$(wc -l < deadcode.txt)** functions"
            echo "- Also unreachable from tests: **$(wc -l < deadcode-test.txt)** functions"
            echo
            echo "By package, the second list:"
            echo
            echo '```'
            sed -E 's#/[^/]+:[0-9]+:[0-9]+:.*##; s#^[^:]+:[0-9]+:[0-9]+:.*#(root)#' deadcode-test.txt | sort | uniq -c | sort -rn | head -n 20
            echo '```'
            echo
            echo "Both lists are in the deadcode artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deadcode
          path: |
            deadcode.txt
            deadcode-test.txt
