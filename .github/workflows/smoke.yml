name: Smoke

# Nightly: the smoke suite's full tier, every scenario (see CONTRIBUTING.md,
# "Smoke testing"). Pacing is enforced: a first-cycle age of the progression
# scenario outside 0.5x-2x of its target (config.AgeTargets) fails the job,
# as does anything else that breaks.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (full tier)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      # A flag, not the secrets themselves; empty until the secrets are set,
      # and the email step then skips.
      MAIL_ENABLED: ${{ secrets.MAIL_USERNAME != '' && secrets.MAIL_PASSWORD != '' && secrets.MAIL_TO != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Smoke (full tier, all scenarios)
        id: smoke
        run: go run ./cmd/smoke -tier full -scenario all -pacing enforce -v -out smoke-report

      - name: Job summary
        if: ${{ always() }}
        run: |
          if [ -f smoke-report/summary.md ]; then
            cat smoke-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The smoke run wrote no report; see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: smoke-report
          path: smoke-report/
          if-no-files-found: warn

      - name: Email body
        id: email
        if: ${{ always() && env.MAIL_ENABLED == 'true' }}
        env:
          RESULT: ${{ steps.smoke.outcome == 'success' && 'PASS' || 'FAIL' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: bash scripts/smoke-email.sh nightly

      - name: Email the report
        if: ${{ always() && env.MAIL_ENABLED == 'true' && steps.email.outcome == 'success' }}
        # dawidd6/action-send-mail v22
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: AgeForge Smoke <${{ secrets.MAIL_USERNAME }}>
          subject: ${{ steps.email.outputs.subject }}
          body: file://${{ runner.temp }}/smoke-email.md
          html_body: file://${{ runner.temp }}/smoke-email.md
          convert_markdown: true
          attachments: ${{ steps.email.outputs.attachments }}
