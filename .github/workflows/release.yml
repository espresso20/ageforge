name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -o dist/ageforge-linux-amd64   .
          GOOS=linux   GOARCH=arm64 go build -o dist/ageforge-linux-arm64   .
          GOOS=darwin  GOARCH=amd64 go build -o dist/ageforge-macos-amd64   .
          GOOS=darwin  GOARCH=arm64 go build -o dist/ageforge-macos-arm64   .
          GOOS=windows GOARCH=amd64 go build -o dist/ageforge-windows-amd64.exe .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
