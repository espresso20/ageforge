name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-X main.version=${VERSION}"
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/ageforge-linux-amd64   .
          GOOS=linux   GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/ageforge-linux-arm64   .
          GOOS=darwin  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/ageforge-macos-amd64   .
          GOOS=darwin  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/ageforge-macos-arm64   .
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/ageforge-windows-amd64.exe .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Extract release notes
        run: |
          awk '/^## \[/{if(p) exit; p=1; next} p{print}' CHANGELOG.md \
            | sed '/^$/d' > /tmp/release_notes.md
          [ -s /tmp/release_notes.md ] || echo "See CHANGELOG.md for details." > /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.md
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          VERSION="${{ github.ref_name }}"
          NOTES=$(head -20 /tmp/release_notes.md)
          URL="https://github.com/espresso20/ageforge/releases/tag/${VERSION}"
          PAYLOAD=$(jq -n \
            --arg title "AgeForge ${VERSION} Released!" \
            --arg url "$URL" \
            --arg desc "$NOTES" \
            '{username:"AgeForge Releases",embeds:[{title:$title,url:$url,color:15771904,description:$desc,footer:{text:"github.com/espresso20/ageforge/releases"}}]}')
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
