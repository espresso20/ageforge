name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-X main.version=${VERSION}"
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/ageforge-linux-amd64   .
          GOOS=linux   GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/ageforge-linux-arm64   .
          GOOS=darwin  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/ageforge-macos-amd64   .
          GOOS=darwin  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/ageforge-macos-arm64   .
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/ageforge-windows-amd64.exe .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Extract release notes
        run: |
          awk '/^## \[/{if(p) exit; p=1; next} p{print}' CHANGELOG.md \
            | sed '/^$/d' > /tmp/release_notes.md
          [ -s /tmp/release_notes.md ] || echo "See CHANGELOG.md for details." > /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.md
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          RELEASE_URL="https://github.com/espresso20/ageforge/releases/tag/${VERSION}"
          NOTES=$(head -20 /tmp/release_notes.md)
          python3 - <<PYEOF
          import os, json, urllib.request

          version  = os.environ["VERSION"] if "VERSION" in os.environ else "${VERSION}"
          url      = "${RELEASE_URL}"
          notes    = """${NOTES}"""
          webhook  = os.environ.get("WEBHOOK_URL", "")

          if not webhook:
              print("No WEBHOOK_URL set, skipping Discord notification")
              exit(0)

          # Trim notes to fit Discord embed description limit
          if len(notes) > 3000:
              notes = notes[:2997] + "..."

          payload = {
              "username": "AgeForge Releases",
              "embeds": [{
                  "title": f"AgeForge {version} Released!",
                  "url": url,
                  "color": 0xf0a500,
                  "description": notes if notes.strip() else "See release page for details.",
                  "footer": {"text": "Download at github.com/espresso20/ageforge/releases"}
              }]
          }

          data = json.dumps(payload).encode()
          req  = urllib.request.Request(webhook, data=data, headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req)
          print(f"Discord notified for {version}")
          PYEOF
