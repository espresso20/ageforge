name: Release

# A v* tag builds the three archives and publishes the release. A pull request
# that edits this file, or a manual run, builds the same files and publishes
# nothing (the release-dry-run artifact).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # Release builds keep saves in the per-user folder (game.DataHome).
  LDFLAGS: -X github.com/espresso20/ageforge/game.DataHome=user

jobs:
  linux-windows:
    runs-on: ubuntu-22.04 # older glibc, so the Linux build runs on more systems
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev
      - name: Build
        run: |
          TAG="${GITHUB_REF_NAME}"; [ "$GITHUB_REF_TYPE" = tag ] || TAG="dev-${GITHUB_SHA::7}"
          mkdir -p out AgeForge
          go build -trimpath -ldflags "-s -w -X main.version=$TAG $LDFLAGS" -o AgeForge/ageforge .
          ./AgeForge/ageforge --version
          tar czf out/AgeForge-linux-amd64.tar.gz AgeForge
          rm -r AgeForge; mkdir AgeForge
          # windowsgui: the game is its own window, so no console opens beside it.
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$TAG $LDFLAGS" -o AgeForge/AgeForge.exe .
          zip -qr out/AgeForge-windows.zip AgeForge
      - name: Check the archives
        run: |
          tar tzf out/AgeForge-linux-amd64.tar.gz | grep -qx 'AgeForge/ageforge'
          unzip -l out/AgeForge-windows.zip | grep -q 'AgeForge/AgeForge.exe'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-windows
          path: out/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the universal app
        run: |
          TAG="${GITHUB_REF_NAME}"; [ "$GITHUB_REF_TYPE" = tag ] || TAG="dev-${GITHUB_SHA::7}"
          V="${TAG#v}"
          # No cgo: Ebitengine reaches Metal and Cocoa through purego on macOS, so both slices cross-build.
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$TAG $LDFLAGS" -o "ageforge-$arch" .
          done
          C=AgeForge.app/Contents
          mkdir -p $C/MacOS $C/Resources AgeForge.iconset out
          lipo -create -output $C/MacOS/AgeForge ageforge-arm64 ageforge-amd64
          for s in 16 32 128 256 512; do
            sips -z $s $s docs/icon.png --out AgeForge.iconset/icon_${s}x${s}.png > /dev/null
            sips -z $((s * 2)) $((s * 2)) docs/icon.png --out AgeForge.iconset/icon_${s}x${s}@2x.png > /dev/null
          done
          iconutil -c icns AgeForge.iconset -o $C/Resources/AgeForge.icns
          cat > $C/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>io.ageforge.game</string>
          <key>CFBundleName</key><string>AgeForge</string>
          <key>CFBundleDisplayName</key><string>AgeForge</string>
          <key>CFBundleExecutable</key><string>AgeForge</string>
          <key>CFBundleIconFile</key><string>AgeForge</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>$V</string>
          <key>CFBundleVersion</key><string>$V</string>
          <key>LSMinimumSystemVersion</key><string>12.0</string>
          <key>NSHighResolutionCapable</key><true/>
          <key>LSApplicationCategoryType</key><string>public.app-category.games</string>
          </dict></plist>
          PLIST
          codesign --force --deep -s - AgeForge.app
          codesign --verify --deep --strict AgeForge.app
          lipo -info $C/MacOS/AgeForge | tee /dev/stderr | grep -q 'x86_64 arm64\|arm64 x86_64'
          $C/MacOS/AgeForge --version
          ditto -c -k --keepParent AgeForge.app out/AgeForge-macos.zip
          unzip -l out/AgeForge-macos.zip | grep -q 'AgeForge.app/Contents/MacOS/AgeForge'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  release:
    needs: [linux-windows, macos]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write # creates the release; the other jobs only read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd files && sha256sum AgeForge-* > SHA256SUMS.txt && cd ..
          # The tag's own section on a tag; [Unreleased] otherwise. Strip --- lines.
          HEAD="## [Unreleased]"; [ "$GITHUB_REF_TYPE" = tag ] && HEAD="## [$TAG]"
          awk -v h="$HEAD" 'index($0, h) == 1 {p = 1; next} /^## \[/ {p = 0} p && !/^---$/' CHANGELOG.md > notes.md
          if [ "$GITHUB_REF_TYPE" = tag ] && ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $HEAD"; exit 1
          fi
      - name: Publish the release
        if: github.ref_type == 'tag'
        run: gh release create "$TAG" --verify-tag --title "AgeForge $TAG" --notes-file notes.md files/*
      - name: Dry run
        if: github.ref_type != 'tag'
        run: |
          { echo "### Dry run: nothing published"; echo; echo '```'; (cd files && sha256sum -c SHA256SUMS.txt; ls -l); echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type != 'tag'
        with:
          name: release-dry-run
          path: files/*
          retention-days: 7
      - name: Notify Discord
        if: github.ref_type == 'tag' && env.WEBHOOK_URL != ''
        run: |
          URL="https://github.com/espresso20/ageforge/releases/tag/${TAG}"
          THUMB="https://github.com/espresso20.png"
          # Bullet lines from each changelog section (max 8 per section), as embed fields.
          FIELDS='[]'
          for sec in "✨  Added:Added" "🔧  Fixed:Fixed" "⚖️  Balance:Balance" "🔄  Changed:Changed" "📋  Other:Other"; do
            BODY=$(awk "/^### ${sec#*:}/{p=1;next} /^###/{p=0} p && /^-/{print}" notes.md | head -8)
            FIELDS=$(jq -n --argjson f "$FIELDS" --arg n "${sec%%:*}" --arg v "$BODY" \
              'if $v != "" then $f + [{name: $n, value: $v, inline: false}] else $f end')
          done
          FIELDS=$(jq -n --argjson f "$FIELDS" --arg url "$URL" \
            '$f + [{name: "📥  Download", value: ("[**Download from the release page →**](" + $url + ")"), inline: false}]')
          PAYLOAD=$(jq -n --arg version "$TAG" --arg url "$URL" --arg thumb "$THUMB" \
            --argjson fields "$FIELDS" --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{username: "AgeForge", avatar_url: $thumb, embeds: [{
              title: ("🏛️  AgeForge " + $version + " — Now Live"), url: $url, color: 15771904,
              description: "A new version is live. Build your civilization from the **Primitive Age** to the **Transcendent**.",
              fields: $fields, thumbnail: {url: $thumb},
              footer: {text: "github.com/espresso20/ageforge/releases"}, timestamp: $ts}]}')
          curl -s -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d "$PAYLOAD"
