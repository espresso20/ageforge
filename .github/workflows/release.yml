name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-X main.version=${VERSION}"
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/ageforge-linux-amd64   .
          GOOS=linux   GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/ageforge-linux-arm64   .
          GOOS=darwin  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/ageforge-macos-amd64   .
          GOOS=darwin  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/ageforge-macos-arm64   .
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/ageforge-windows-amd64.exe .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Extract release notes
        run: |
          # Match the first versioned section (## [vX.Y.Z]) — skips [Unreleased]
          # Stop at the next versioned section. Strip --- separators.
          awk '/^## \[v[0-9]/{if(p) exit; p=1; next} p && !/^---$/{print}' CHANGELOG.md \
            > /tmp/release_notes.md
          [ -s /tmp/release_notes.md ] || echo "See CHANGELOG.md for details." > /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.md
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          VERSION="${{ github.ref_name }}"
          URL="https://github.com/espresso20/ageforge/releases/tag/${VERSION}"
          THUMB="https://github.com/espresso20.png"

          # Pull bullet lines from each changelog section (max 8 per section)
          sect() { awk "/^### $1/{p=1;next} /^###/{p=0} p && /^-/{print}" /tmp/release_notes.md | head -8; }
          ADDED=$(sect "Added")
          FIXED=$(sect "Fixed")
          BALANCE=$(sect "Balance")
          CHANGED=$(sect "Changed")
          OTHER=$(sect "Other")

          # Build fields array — omit empty sections, always append Download
          FIELDS=$(jq -n \
            --arg added   "$ADDED"   \
            --arg fixed   "$FIXED"   \
            --arg balance "$BALANCE" \
            --arg changed "$CHANGED" \
            --arg other   "$OTHER"   \
            --arg url     "$URL"     \
            '[
              if $added   != "" then {"name":"✨  Added",   "value":$added,   "inline":false} else empty end,
              if $fixed   != "" then {"name":"🔧  Fixed",   "value":$fixed,   "inline":false} else empty end,
              if $balance != "" then {"name":"⚖️  Balance",  "value":$balance, "inline":false} else empty end,
              if $changed != "" then {"name":"🔄  Changed", "value":$changed, "inline":false} else empty end,
              if $other   != "" then {"name":"📋  Other",   "value":$other,   "inline":false} else empty end,
              {"name":"📥  Download", "value":("[**GitHub Releases →**](" + $url + ")"), "inline":false}
            ]')

          PAYLOAD=$(jq -n \
            --arg  version "$VERSION" \
            --arg  url     "$URL"     \
            --arg  thumb   "$THUMB"   \
            --argjson fields "$FIELDS" \
            --arg  ts      "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              username:   "AgeForge",
              avatar_url: $thumb,
              embeds: [{
                title:       ("🏛️  AgeForge " + $version + " — Now Live"),
                url:         $url,
                color:       15771904,
                description: "A new version is live. Build your civilization from the **Primitive Age** to the **Transcendent**.",
                fields:      $fields,
                thumbnail:   {url: $thumb},
                footer:      {text: "github.com/espresso20/ageforge/releases"},
                timestamp:   $ts
              }]
            }')

          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

