# Vale configuration. See docs/ci.md for how to run it and how to silence a
# false positive. The project style is in .vale/styles/AgeForge; it encodes the
# wiki's writing rules and nothing else (no generic grammar or spelling
# dictionary, those are deliberately not enabled).
#
# Run it over the pages the rules apply to:
#   vale site/docs README.md
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = AgeForge
